name: article_pulse
description: "Article Pulse – AI-Powered Article Discovery App"
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence & Offline Storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Networking & Feeds
  http: ^1.2.2
  xml: ^6.5.0

  # Utilities & UI
  intl: ^0.19.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  package_info_plus: ^8.3.1
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
